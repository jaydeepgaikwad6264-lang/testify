<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Profile • Testify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="p-3 shadow-sm bg-white d-flex justify-content-between align-items-center">
      <h5 class="m-0 fw-bold text-primary">Profile</h5>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" href="provider-dashboard.html"><i class="bi bi-arrow-left"></i> Back</a>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
    <div class="container mt-4 pb-5">
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between flex-wrap gap-3">
            <div>
              <div class="small text-muted">Wallet Balance</div>
              <div class="fs-4 fw-bold" id="walletBalance">₹0</div>
            </div>
            <div class="d-flex gap-4">
              <div><div class="small text-muted">BP</div><div class="fw-bold" id="walletBp">0</div></div>
              <div><div class="small text-muted">Sugar</div><div class="fw-bold" id="walletSugar">0</div></div>
              <div><div class="small text-muted">Combo</div><div class="fw-bold" id="walletCombo">0</div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
        <h6 class="text-muted m-0">Uploaded Documents</h6>
      </div>
      <div id="documentsContainer" class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div id="docsList" class="list-group list-group-flush">
            <div class="text-muted small">No documents uploaded.</div>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="text-muted m-0">Recent Completed Orders</h6>
        <a class="btn btn-sm btn-outline-primary" href="public/provider-policy/index.html"><i class="bi bi-shield-check"></i> Policy</a>
      </div>
      <div id="historyContainer" class="row g-3"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js?v=20260201"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/provider-account.js"></script>
</body>
</html>
