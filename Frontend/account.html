<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account - Testify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="p-3 shadow-sm bg-white d-flex align-items-center">
            <a href="javascript:history.back()" class="text-dark me-3"><i class="bi bi-arrow-left fs-4"></i></a>
            <h5 class="m-0 fw-bold">My Account</h5>
        </div>
        
        <div class="container mt-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center p-4 mb-3">
                            <i class="bi bi-person-fill text-primary fs-1"></i>
                        </div>
                        <h5 class="mb-1" id="userName">Loading...</h5>
                        <p class="text-muted mb-0" id="userRole">Loading...</p>
                    </div>
                    
                    <form id="accountForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="Enter your email address">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobileInput" placeholder="Enter your mobile number" readonly>
                            <small class="text-muted">Mobile number cannot be changed</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Account Status</label>
                            <div class="d-flex align-items-center">
                                <span class="badge bg-success" id="statusBadge">Active</span>
                                <small class="text-muted ms-2" id="statusText">Account is active</small>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="bi bi-check-circle me-2"></i>Update Profile
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Account Information</h6>
                    <div class="row text-center">
                        <div class="col-6">
                            <div class="text-primary fs-4" id="bookingCount">0</div>
                            <small class="text-muted">Total Bookings</small>
                        </div>
                        <div class="col-6">
                            <div class="text-success fs-4" id="completedCount">0</div>
                            <small class="text-muted">Completed</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </div>
        </div>
        
        <!-- Success Toast -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header bg-success text-white">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <strong class="me-auto">Success</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body" id="toastMessage">
                    Profile updated successfully!
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/account.js"></script>
</body>
</html>
