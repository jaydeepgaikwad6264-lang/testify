<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Provider Dashboard - Testify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="p-3 shadow-sm bg-white d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a href="account.html" class="text-primary text-decoration-none me-3">
                    <div class="bg-primary bg-opacity-10 rounded-circle p-2">
                        <i class="bi bi-person-fill fs-4 text-primary"></i>
                    </div>
                </a>
                <div>
                    <h5 class="m-0 fw-bold text-primary">Testify Provider</h5>
                    <small class="text-muted">Welcome, <span id="providerName">Provider</span></small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" id="onlineToggle" checked>
                <label class="form-check-label small" for="onlineToggle">Online</label>
                </div>
            </div>
        </div>
        <div class="container mt-4 pb-5">
            <div class="card border-0 shadow-sm mb-4 bg-primary text-white">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="m-0">Combo Check Rate</h6>
                        <small class="opacity-75">Today's specialized rate</small>
                    </div>
                    <div class="fs-3 fw-bold">₹109</div>
                </div>
            </div>
            <div id="requestsSection">
                <h6 class="text-muted mb-3">New Requests (2)</h6>
                <div id="requestContainer"></div>
            </div>
            <div id="activeJobSection" class="d-none">
                <div class="alert alert-success d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>Booking Accepted</div>
                </div>
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Customer Details</h5>
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-light rounded-circle p-2 me-3">
                                <i class="bi bi-person fs-4"></i>
                            </div>
                            <div>
                                <h6 class="m-0" id="activeCustomerName">Customer Name</h6>
                                <a href="tel:+" id="activeCustomerPhone" class="text-decoration-none small">Call Customer</a>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted">Service</label>
                            <div class="fw-bold" id="activeService">Service Type</div>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted">Location</label>
                            <div class="d-flex justify-content-between">
                                <span id="activeLocation">Location Address</span>
                                <button id="navigateBtn" class="btn btn-sm btn-primary rounded-pill"><i class="bi bi-cursor-fill"></i> Navigate</button>
                            </div>
                        </div>
                        <div id="providerMap" class="map-container shadow-sm border mb-3"></div>
                        <hr>
                        <h6 class="fw-bold mb-3">Action</h6>
                        <div class="mb-3">
                            <label class="form-label small">Upload Readings (Any format, Max 2)</label>
                            <input class="form-control" type="file" id="reportUpload" multiple>
                            <small class="text-muted d-block mt-1">You can upload up to 2 files of any format.</small>
                        </div>
                        <button class="btn btn-success w-100 py-3 shadow" onclick="completeJob()">Mark Completed</button>
                        <button class="btn btn-outline-danger w-100 py-3 shadow mt-2" onclick="cancelJob()">Cancel Service</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="nav-bottom">
        <a href="provider-dashboard.html" class="nav-item active">
            <i class="bi bi-speedometer2"></i>
            <span>Bookings</span>
        </a>
        <a href="provider-wallet.html" class="nav-item">
            <i class="bi bi-wallet2"></i>
            <span>Wallet</span>
        </a>
        <a href="provider-account.html" class="nav-item">
            <i class="bi bi-person-circle"></i>
            <span>Account</span>
        </a>
    </div>
    <footer class="footer">
        <div class="container">
            <ul class="nav justify-content-center">
                <li class="nav-item"><a href="privacy-policy.html" class="nav-link px-2 text-muted">Privacy Policy</a></li>
                <li class="nav-item"><a href="contact-us.html" class="nav-link px-2 text-muted">Contact Us</a></li>
            </ul>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js?v=20260201"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/provider.js"></script>
</body>
</html>
