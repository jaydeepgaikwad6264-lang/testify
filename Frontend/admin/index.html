<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard • Testify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid p-0">
    <div class="bg-primary text-white py-4 px-4 mb-4">
      <div class="d-flex justify-content-between align-items-end">
        <div>
          <h2 class="m-0 fw-bold">Admin Dashboard</h2>
          <p class="m-0 opacity-75">Manage users, providers, and orders</p>
        </div>
        <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="container">
      <div class="row g-3 mb-4" id="metricsRow">
        <div class="col-6 col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div>
                  <div class="text-muted small">Users</div>
                  <div class="fs-4 fw-bold" id="metricUsers">0</div>
                </div>
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3"><i class="bi bi-people"></i></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div>
                  <div class="text-muted small">Providers</div>
                  <div class="fs-4 fw-bold" id="metricProviders">0</div>
                </div>
                <div class="bg-success bg-opacity-10 text-success rounded-circle p-3"><i class="bi bi-person-badge"></i></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div>
                  <div class="text-muted small">Pending Providers</div>
                  <div class="fs-4 fw-bold" id="metricPendingProviders">0</div>
                </div>
                <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3"><i class="bi bi-hourglass-split"></i></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <div>
                  <div class="text-muted small">Orders</div>
                  <div class="fs-4 fw-bold" id="metricOrders">0</div>
                </div>
                <div class="bg-secondary bg-opacity-10 text-secondary rounded-circle p-3"><i class="bi bi-receipt"></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    <div id="roleGate" class="alert alert-warning">Admin access required.</div>
    <div id="adminContent" class="d-none">
      <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#usersTab" type="button" role="tab">Users</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#providersTab" type="button" role="tab">Providers</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#ordersTab" type="button" role="tab">Orders</button>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="usersTab" role="tabpanel">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div id="usersTable" class="table-responsive"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="providersTab" role="tabpanel">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div id="providersTable" class="table-responsive"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="ordersTab" role="tabpanel">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div id="ordersTable" class="table-responsive"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260904"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (user && user.role === 'admin') {
        document.getElementById('roleGate').classList.add('d-none');
        document.getElementById('adminContent').classList.remove('d-none');
      } else {
        document.getElementById('roleGate').textContent = 'Admin access required. Please login as admin.';
      }
    });
  </script>
</body>
</html>
